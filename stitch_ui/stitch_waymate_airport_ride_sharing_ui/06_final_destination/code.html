<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Bar -->
    <header class="px-page-margin pt-gutter-xl pb-gutter-md flex items-center justify-between">
      <a href="../05-flight-details/FlightDetails.html" aria-label="Go back" class="w-11 h-11 rounded-full bg-surface-card border border-border flex items-center justify-center text-on-surface">

      <section class="flex flex-col gap-gutter-xs">
        <h1 class="font-headline text-headline-lg text-on-surface" data-design-text-token="headline-lg">Final Destination</h1>
        <p class="font-body text-body-md text-secondary-text text-pretty" data-design-text-token="body-md">Pin your exact drop-off after landing at Delhi IGI Airport for smart route matching.</p>
      </section>

      <!-- Map-based Location Selector -->
      <section class="relative w-full h-44 rounded-lg overflow-hidden border border-border bg-surface-secondary">
        <!-- Minimalist Map Grid SVG -->
        <svg viewBox="0 0 350 180" class="w-full h-full" aria-label="Destination map pin">
          <rect width="350" height="180" fill="#E8DDCA"></rect>
          <path d="M0 45 L350 45 M0 95 L350 95 M0 140 L350 140 M75 0 L75 180 M175 0 L175 180 M275 0 L275 180" stroke="#D8CEBD" stroke-width="2"></path>
          <path d="M20 155 Q 110 110, 175 90 T 320 40" stroke="#1C1B18" stroke-width="3" fill="none" stroke-dasharray="6 4"></path>
          <circle cx="175" cy="90" r="18" fill="#1C1B18" fill-opacity="0.14"></circle>
          <circle cx="175" cy="90" r="7" fill="#1C1B18"></circle>
        </svg>
        <div class="absolute bottom-gutter-sm left-gutter-sm right-gutter-sm bg-surface-card border border-border rounded-md px-gutter-md py-gutter-sm flex items-center justify-between">
          <div class="flex items-center gap-gutter-xs">
            <span class="material-symbols-outlined text-[18px] text-primary" aria-hidden="true">location_on</span>
            <span class="font-label text-label-sm text-on-surface" data-design-text-token="label-sm">Pinned: Noida Sector 62</span>
          </div>
          <button type="button" class="font-label text-label-sm text-primary underline">Adjust pin</button>
        </div>
      </section>

      <!-- Destination Form Fields -->
      <section class="bg-surface-card border border-border rounded-lg p-gutter-lg flex flex-col gap-gutter-md">
        <div class="grid grid-cols-2 gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-sm text-secondary-text" data-design-text-token="label-sm">Destination city</span>
            <input type="text" value="Noida" class="w-full min-h-[44px] px-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </label>
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-sm text-secondary-text" data-design-text-token="label-sm">Sector</span>
            <input type="text" value="Sector 62" class="w-full min-h-[44px] px-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </label>
        </div>

        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-sm text-secondary-text" data-design-text-token="label-sm">Locality</span>
          <input type="text" value="Institutional Area, Sector 62" class="w-full min-h-[44px] px-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
        </label>

        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-sm text-secondary-text" data-design-text-token="label-sm">Complete address</span>

        </label>

        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-sm text-secondary-text" data-design-text-token="label-sm">Landmark</span>

    </footer>
