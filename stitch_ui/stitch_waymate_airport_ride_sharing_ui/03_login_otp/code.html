<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayMate — Login &amp; OTP Verification</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'primary': '#1C1B18',
        'on-primary': '#FAF7F0',
        'primary-hover': '#32302D',
        'surface': '#F3EBDD',
        'on-surface': '#24231F',
        'surface-card': '#FAF7F0',
        'on-surface-card': '#24231F',
        'surface-secondary': '#E8DDCA',
        'on-surface-secondary': '#24231F',
        'surface-muted': '#E9E2D4',
        'secondary-text': '#5E594F',
        'border': '#D8CEBD',
        'border-strong': '#B1AA9E',
        'success': '#526B50',
        'on-success': '#FAF7F0',
        'success-container': '#DCF9D6',
        'on-success-container': '#1F361F',
        'error': '#A34D40',
        'on-error': '#FAF7F0',
        'error-container': '#FFEDEA',
        'on-error-container': '#5C1810',
      },
      borderRadius: {
        'sm': '6px',
        'DEFAULT': '10px',
        'md': '12px',
        'lg': '16px',
        'xl': '24px',
        'full': '9999px',
      },
      spacing: {
        'gutter-xs': '4px',
        'gutter-sm': '8px',
        'gutter-md': '12px',
        'gutter-lg': '16px',
        'gutter-xl': '24px',
        'section': '32px',
        'page-margin': '20px',
      },
      fontFamily: {
        'display': ['"Red Hat Text"', 'sans-serif'],
        'headline': ['"Red Hat Text"', 'sans-serif'],
        'title': ['"Instrument Sans"', 'sans-serif'],
        'body': ['"Instrument Sans"', 'sans-serif'],
        'label': ['"Instrument Sans"', 'sans-serif'],
        'mono': ['"Spline Sans Mono"', 'monospace'],
      },
      fontSize: {
        'display-lg': ['36px', { lineHeight: '42px', letterSpacing: '-0.5px', fontWeight: '700' }],
        'display-lg-mobile': ['28px', { lineHeight: '34px', letterSpacing: '-0.3px', fontWeight: '700' }],
        'headline-lg': ['24px', { lineHeight: '30px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.15px', fontWeight: '600' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '17px', letterSpacing: '0.1px', fontWeight: '400' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '600' }],
        'label-sm': ['11px', { lineHeight: '16px', letterSpacing: '0.4px', fontWeight: '600' }],
        'mono-md': ['14px', { lineHeight: '20px', letterSpacing: '0.2px', fontWeight: '500' }],
        'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0.2px', fontWeight: '500' }],
      },
      transitionDuration: {
        'state-change': '120ms',
        'surface-enter': '220ms',
        'surface-exit': '150ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
        'surface-exit': 'cubic-bezier(0.3, 0, 1, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Spline+Sans+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface font-body antialiased">
  <main class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col justify-between px-page-margin py-gutter-xl" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Brand -->
    <header class="flex items-center justify-between pt-gutter-sm">
      <div class="flex items-center gap-gutter-sm">
        <span class="w-10 h-10 rounded-md bg-primary text-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">flight_land</span>
        </span>
        <span class="font-headline text-headline-md text-on-surface" data-design-text-token="headline-md">WayMate</span>
      </div>
      <div class="inline-flex rounded-full bg-surface-secondary p-1 border border-border">
        <button type="button" onclick="showStep(&#39;phone&#39;)" id="tab-phone" class="px-3 py-1 rounded-full bg-primary text-on-primary font-label text-label-sm">Mobile</button>
        <button type="button" onclick="showStep(&#39;otp&#39;)" id="tab-otp" class="px-3 py-1 rounded-full text-secondary-text font-label text-label-sm">OTP</button>
      </div>
    </header>

    <!-- Step 1: Mobile Number Entry -->
    <section id="step-phone" class="flex flex-col gap-gutter-xl my-auto">
      <div class="flex flex-col gap-gutter-xs">
        <h1 class="font-display text-display-lg-mobile text-on-surface" data-design-text-token="display-lg-mobile">Welcome Back</h1>
        <p class="font-body text-body-md text-secondary-text text-pretty" data-design-text-token="body-md">Sign in with your Indian mobile number to plan or join an airport pool.</p>
      </div>

      <article data-component-id="card-elevated" data-component-type="card" data-component-variant="elevated" class="bg-surface-card border border-border rounded-lg p-gutter-lg flex flex-col gap-gutter-lg">
        <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-lg" class="font-label text-label-lg text-on-surface">Mobile number</span>
          <div class="flex items-center gap-gutter-sm">
            <div class="min-h-[48px] px-gutter-md rounded-md bg-surface-secondary border border-border flex items-center gap-gutter-xs shrink-0">
              <span class="font-mono text-mono-md text-on-surface tabular-nums" data-design-text-token="mono-md">+91</span>
            </div>
            <input type="tel" inputmode="numeric" maxlength="10" value="98765 43210" placeholder="98765 43210" class="w-full min-h-[48px] px-gutter-lg py-gutter-md rounded-md bg-surface border border-border font-mono text-mono-md text-on-surface tabular-nums placeholder:text-secondary-text focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </div>
          <span data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">We will send a 6-digit verification code via SMS</span>
        </label>

        <button type="button" onclick="showStep(&#39;otp&#39;)" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center min-h-[48px] w-full px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:bg-primary-hover transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Continue with OTP</span>
        </button>
      </article>
    </section>

    <!-- Step 2: 6-Digit OTP Verification -->
    <section id="step-otp" class="hidden flex-col gap-gutter-xl my-auto">
      <div class="flex flex-col gap-gutter-xs">
        <button type="button" onclick="showStep(&#39;phone&#39;)" class="inline-flex items-center gap-gutter-xs text-secondary-text hover:text-on-surface w-fit mb-gutter-xs">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_back</span>
          <span class="font-label text-label-lg" data-design-text-token="label-lg">Change number</span>
        </button>
        <h1 class="font-display text-display-lg-mobile text-on-surface" data-design-text-token="display-lg-mobile">Verify OTP</h1>
        <p class="font-body text-body-md text-secondary-text" data-design-text-token="body-md">Enter the 6-digit code sent to <span class="font-mono text-on-surface tabular-nums">+91 98765 43210</span></p>
      </div>

      <article class="bg-surface-card border border-border rounded-lg p-gutter-lg flex flex-col gap-gutter-lg">
        <div class="grid grid-cols-6 gap-gutter-sm" role="group" aria-label="6-digit OTP input">
          <input type="text" inputmode="numeric" maxlength="1" value="4" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
          <input type="text" inputmode="numeric" maxlength="1" value="8" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
          <input type="text" inputmode="numeric" maxlength="1" value="2" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
          <input type="text" inputmode="numeric" maxlength="1" value="9" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
          <input type="text" inputmode="numeric" maxlength="1" value="1" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
          <input type="text" inputmode="numeric" maxlength="1" value="6" class="h-12 w-full text-center rounded-md bg-surface border border-primary font-mono text-headline-md text-on-surface tabular-nums focus:ring-1 focus:ring-primary focus:outline-none">
        </div>

        <div class="flex items-center justify-between">
          <span class="font-body text-body-sm text-secondary-text" data-design-text-token="body-sm">Resend available in 00:24</span>
          <button type="button" class="font-label text-label-lg text-on-surface underline underline-offset-4">
            <span data-design-text-token="label-lg">Resend OTP</span>
          </button>
        </div>

        <a href="../04-home/HomeDashboard.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center min-h-[48px] w-full px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:bg-primary-hover transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Verify &amp; Continue</span>
        </a>
      </article>
    </section>

    <!-- Footer: Terms & Privacy -->
    <footer class="text-center pb-gutter-sm">
      <p class="font-body text-body-sm text-secondary-text text-pretty" data-design-text-token="body-sm">
        By continuing, you agree to WayMate&#39;s <span class="text-on-surface underline">Terms of Service</span> and <span class="text-on-surface underline">Privacy Policy</span>.
      </p>
    </footer>
  </main>

  <script>
    function showStep(step) {
      const phone = document.getElementById('step-phone');
      const otp = document.getElementById('step-otp');
      const tabPhone = document.getElementById('tab-phone');
      const tabOtp = document.getElementById('tab-otp');
      if (step === 'otp') {
        phone.classList.add('hidden');
        otp.classList.remove('hidden');
        otp.classList.add('flex');
        tabOtp.className = 'px-3 py-1 rounded-full bg-primary text-on-primary font-label text-label-sm';
        tabPhone.className = 'px-3 py-1 rounded-full text-secondary-text font-label text-label-sm';
      } else {
        otp.classList.add('hidden');
        otp.classList.remove('flex');
        phone.classList.remove('hidden');
        tabPhone.className = 'px-3 py-1 rounded-full bg-primary text-on-primary font-label text-label-sm';
        tabOtp.className = 'px-3 py-1 rounded-full text-secondary-text font-label text-label-sm';
      }
    }
  </script>


</body></html>
