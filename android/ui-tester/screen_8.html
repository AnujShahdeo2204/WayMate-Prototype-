  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="px-page-margin pt-gutter-xl pb-gutter-md flex items-center justify-between">
      <a href="../08-luggage-details/LuggageDetails.html" aria-label="Go back" class="w-11 h-11 rounded-full bg-surface-card border border-border flex items-center justify-center text-on-surface">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </a>
      <span class="font-mono text-mono-sm text-secondary-text tabular-nums" data-design-text-token="mono-sm">Step 5 of 5</span>
    </header>

    <main class="flex-1 px-page-margin pb-gutter-xl flex flex-col gap-gutter-xl">
      <section class="flex flex-col gap-gutter-xs">
        <h1 class="font-headline text-headline-lg text-on-surface" data-design-text-token="headline-lg">Language Preference</h1>
        <p class="font-body text-body-md text-secondary-text text-pretty" data-design-text-token="body-md">Helps your driver communicate clearly with you at pickup and drop-off.</p>
      </section>

      <section class="grid grid-cols-1 gap-gutter-md" role="radiogroup" aria-label="Preferred language">
        <button type="button" onclick="selectLang(&#39;en&#39;)" id="lang-en" class="bg-surface-card border-2 border-primary rounded-lg p-gutter-lg flex items-center justify-between text-left">
          <div class="flex items-center gap-gutter-md">
            <span class="w-11 h-11 rounded-md bg-primary text-on-primary flex items-center justify-center font-headline text-title-md">En</span>
            <div>
              <p class="font-title text-title-md text-on-surface" data-design-text-token="title-md">English</p>
              <p class="font-body text-body-sm text-secondary-text" data-design-text-token="body-sm">Driver &amp; app communication in English</p>
            </div>
          </div>
          <span id="check-en" class="material-symbols-outlined text-[22px] text-primary" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">check_circle</span>
        </button>

        <button type="button" onclick="selectLang(&#39;hi&#39;)" id="lang-hi" class="bg-surface-card border border-border rounded-lg p-gutter-lg flex items-center justify-between text-left">
          <div class="flex items-center gap-gutter-md">
            <span class="w-11 h-11 rounded-md bg-surface-secondary text-on-surface flex items-center justify-center font-headline text-title-md">हि</span>
            <div>
              <p class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Hindi (हिन्दी)</p>
              <p class="font-body text-body-sm text-secondary-text" data-design-text-token="body-sm">Driver communication in Hindi</p>
            </div>
          </div>
          <span id="check-hi" class="material-symbols-outlined text-[22px] text-border-strong" aria-hidden="true">radio_button_unchecked</span>
        </button>
      </section>
    </main>

    <footer class="px-page-margin pb-gutter-xl pt-gutter-sm">
      <a href="../10-finding-pool/FindingPool.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center min-h-[48px] w-full px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:bg-primary-hover transition-colors duration-state-change">
        <span data-design-text-token="label-lg">Find My Pool</span>
      </a>
    </footer>
  </div>

  <script>
    function selectLang(lang) {
      const isEn = lang === 'en';
      document.getElementById('lang-en').className = isEn
        ? 'bg-surface-card border-2 border-primary rounded-lg p-gutter-lg flex items-center justify-between text-left'
        : 'bg-surface-card border border-border rounded-lg p-gutter-lg flex items-center justify-between text-left';
      document.getElementById('lang-hi').className = !isEn
        ? 'bg-surface-card border-2 border-primary rounded-lg p-gutter-lg flex items-center justify-between text-left'
        : 'bg-surface-card border border-border rounded-lg p-gutter-lg flex items-center justify-between text-left';
      document.getElementById('check-en').textContent = isEn ? 'check_circle' : 'radio_button_unchecked';
      document.getElementById('check-en').className = isEn ? 'material-symbols-outlined text-[22px] text-primary' : 'material-symbols-outlined text-[22px] text-border-strong';
      document.getElementById('check-hi').textContent = !isEn ? 'check_circle' : 'radio_button_unchecked';
      document.getElementById('check-hi').className = !isEn ? 'material-symbols-outlined text-[22px] text-primary' : 'material-symbols-outlined text-[22px] text-border-strong';
    }
  </script>



<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', function(e) {
            const href = el.getAttribute('href') || '';
            const text = el.innerText || '';
            
            // Send click intent to parent frame
            window.parent.postMessage({
                type: 'WAYMATE_NAV',
                href: href,
                text: text.trim()
            }, '*');
            
            if (href && (href.startsWith('#') || href.startsWith('javascript:'))) {
                return;
            }
            if (href) {
                e.preventDefault();
            }
        });
    });
});
</script>
</body></html>
