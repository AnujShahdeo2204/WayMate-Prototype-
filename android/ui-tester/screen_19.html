  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Spline+Sans+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col justify-between px-page-margin py-section" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="flex items-center justify-between">
      <h1 class="font-headline text-headline-lg text-on-surface" data-design-text-token="headline-lg">Rate Your Ride</h1>
      <a href="../04-home/HomeDashboard.html" class="font-label text-label-lg text-secondary-text hover:text-on-surface">Back to Home</a>
    </header>

    <main class="flex flex-col gap-gutter-xl my-auto">
      <!-- Driver Card -->
      <section class="bg-surface-card border border-border rounded-lg p-gutter-xl flex flex-col items-center text-center gap-gutter-md">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrDmIJqvwnE85InZ-GMFWFX_4EAlJX5yP8E_zYUo6lIvGtQdJW4YLg0kWDMvgEqEWYml1CZKttPEqAs58MB4H-mCBbZ5mh1Cnf1pq6GoYCbmzujYm3LkL0OoC9aqnlbhrrjkZxL_oUfZAQzI2IOVXRuL_e6w9lVI57RErlmHzmDKpZwmOro9MmFGO-L8vbjwm57wG432IbXlaseQjy8aDhpiGvooFLUog6ihxYvbZCdvzWBP0q0" alt="Rajesh Kumar" class="w-20 h-20 rounded-full object-cover border border-border">
        <div>
          <h2 class="font-headline text-headline-md text-on-surface" data-design-text-token="headline-md">Rajesh Kumar</h2>
          <p class="font-body text-body-sm text-secondary-text">Maruti Ertiga · DEL T3 → Noida Sec 62</p>
        </div>

        <!-- Interactive 5-Star Rating -->
        <div class="flex items-center gap-gutter-sm pt-gutter-sm" role="group" aria-label="Driver star rating">
          <button type="button" onclick="setStars(1)" class="star-btn p-1 text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;">star</span></button>
          <button type="button" onclick="setStars(2)" class="star-btn p-1 text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;">star</span></button>
          <button type="button" onclick="setStars(3)" class="star-btn p-1 text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;">star</span></button>
          <button type="button" onclick="setStars(4)" class="star-btn p-1 text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;">star</span></button>
          <button type="button" onclick="setStars(5)" class="star-btn p-1 text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;">star</span></button>
        </div>
      </section>

      <!-- Feedback Field -->
      <label class="flex flex-col gap-gutter-xs">
        <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Share feedback (optional)</span>
        <textarea rows="4" placeholder="Smooth pickup at Terminal 3, plenty of boot space for luggage." class="w-full p-gutter-md rounded-lg bg-surface-card border border-border font-body text-body-md text-on-surface placeholder:text-secondary-text focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"></textarea>
      </label>
    </main>

    <footer class="flex flex-col gap-gutter-sm">
      <a href="../04-home/HomeDashboard.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center min-h-[48px] w-full px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:bg-primary-hover">
        <span data-design-text-token="label-lg">Submit Feedback</span>
      </a>
      <a href="../04-home/HomeDashboard.html" class="inline-flex items-center justify-center min-h-[44px] w-full font-label text-label-lg text-secondary-text hover:text-on-surface">
        <span>Back to Home</span>
      </a>
    </footer>
  </div>

  <script>
    function setStars(count) {
      document.querySelectorAll('.star-btn').forEach((btn, idx) => {
        const icon = btn.querySelector('.material-symbols-outlined');
        if (idx < count) {
          btn.className = 'star-btn p-1 text-primary';
          icon.style.fontVariationSettings = "'FILL' 1";
        } else {
          btn.className = 'star-btn p-1 text-border-strong';
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      });
    }
  </script>



<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', function(e) {
            const href = el.getAttribute('href') || '';
            const text = el.innerText || '';
            
            // Send click intent to parent frame
            window.parent.postMessage({
                type: 'WAYMATE_NAV',
                href: href,
                text: text.trim()
            }, '*');
            
            if (href && (href.startsWith('#') || href.startsWith('javascript:'))) {
                return;
            }
            if (href) {
                e.preventDefault();
            }
        });
    });
});
</script>
</body></html>
