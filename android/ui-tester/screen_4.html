<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Contextual Top Bar -->
    <header class="px-page-margin pt-gutter-xl pb-gutter-md flex items-center justify-between">
      <a href="../04-home/HomeDashboard.html" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" aria-label="Go back" class="w-11 h-11 rounded-full bg-surface-card border border-border flex items-center justify-center text-on-surface">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </a>
      <span class="font-mono text-mono-sm text-secondary-text tabular-nums" data-design-text-token="mono-sm">Step 1 of 5</span>
    </header>

    <!-- Main Form -->
    <main class="flex-1 px-page-margin pb-gutter-xl flex flex-col gap-gutter-xl">
      <section class="flex flex-col gap-gutter-xs">
        <h1 class="font-headline text-headline-lg text-on-surface" data-design-text-token="headline-lg">Plan Your Airport Ride</h1>
        <p class="font-body text-body-md text-secondary-text text-pretty" data-design-text-token="body-md">Enter your flight details before boarding. WayMate prepares your pool while you fly.</p>
      </section>

      <section class="bg-surface-card border border-border rounded-lg p-gutter-lg flex flex-col gap-gutter-lg">
        <!-- Flight Number & Airline -->
        <div class="grid grid-cols-2 gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Flight number</span>
            <input type="text" value="AI 696" class="w-full min-h-[48px] px-gutter-md rounded-md bg-surface border border-border font-mono text-mono-md text-on-surface uppercase focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </label>
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Airline</span>
            <select class="w-full min-h-[48px] px-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
              <option selected>Air India</option>
              <option>IndiGo</option>
              <option>Akasa Air</option>
              <option>SpiceJet</option>
            </select>
          </label>
        </div>

        <!-- Arrival Airport (Major Indian Airports) -->
        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Arrival airport</span>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined text-[20px] text-secondary-text absolute left-gutter-md pointer-events-none" aria-hidden="true">flight_land</span>
            <select class="w-full min-h-[48px] pl-10 pr-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
              <option selected>DEL – Indira Gandhi International Airport</option>
              <option>BOM – Chhatrapati Shivaji Maharaj Int&#39;l</option>
              <option>BLR – Kempegowda International Airport</option>
              <option>HYD – Rajiv Gandhi International Airport</option>
              <option>MAA – Chennai International Airport</option>
              <option>CCU – Netaji Subhas Chandra Bose Int&#39;l</option>
            </select>
          </div>
        </label>

        <!-- Flight Arrival Date & Expected Arrival Time -->
        <div class="grid grid-cols-2 gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Flight arrival date</span>
            <input type="text" value="26 Nov 2026" class="w-full min-h-[48px] px-gutter-md rounded-md bg-surface border border-border font-body text-body-md text-on-surface tabular-nums focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </label>
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-lg text-on-surface" data-design-text-token="label-lg">Expected arrival</span>
            <input type="text" value="10:30 AM" class="w-full min-h-[48px] px-gutter-md rounded-md bg-surface border border-border font-mono text-mono-md text-on-surface tabular-nums focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          </label>
        </div>
      </section>

      <!-- Info Callout explaining flight-based matching -->
      <div class="bg-surface-secondary border border-border rounded-lg p-gutter-md flex items-start gap-gutter-md">
        <span class="material-symbols-outlined text-[20px] text-on-surface shrink-0 mt-0.5" aria-hidden="true">info</span>
        <p class="font-body text-body-sm text-on-surface text-pretty" data-design-text-token="body-sm">Arrival date and time come from your flight schedule so we can match co-travellers landing within the same 20-minute window.</p>
      </div>
    </main>

    <!-- Bottom CTA -->
    <footer class="px-page-margin pb-gutter-xl pt-gutter-sm">
      <a href="../06-final-destination/FinalDestination.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center min-h-[48px] w-full px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:bg-primary-hover transition-colors duration-state-change">
        <span data-design-text-token="label-lg">Set Final Destination</span>
      </a>
    </footer>
  </div>



<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', function(e) {
            const href = el.getAttribute('href') || '';
            const text = el.innerText || '';
            
            // Send click intent to parent frame
            window.parent.postMessage({
                type: 'WAYMATE_NAV',
                href: href,
                text: text.trim()
            }, '*');
            
            if (href && (href.startsWith('#') || href.startsWith('javascript:'))) {
                return;
            }
            if (href) {
                e.preventDefault();
            }
        });
    });
});
</script>
</body></html>
